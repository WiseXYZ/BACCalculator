name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_CERT_SHA256: 6528be1595e02a8496b2f2df35fa3fd9ade1fba53b2b9ded5dcafedccab7d80d

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the app
        run: npm run build

      - name: Confirm the build makes no network requests
        run: |
          if grep -qE 'fetch\(|XMLHttpRequest|sendBeacon|new WebSocket' dist/assets/*.js; then
            echo "::error::The built app contains a network request mechanism."
            exit 1
          fi
          grep -q "connect-src 'none'" dist/index.html || { echo "::error::Content Security Policy missing."; exit 1; }

      - name: Generate the Android project
        run: npx cap add android

      - name: Stamp the version
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Sign release builds with the app's own key
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  personal {
                      storeFile file("${rootDir}/../keystore/bloodalc.p12")
                      storeType "pkcs12"
                      storePassword "bloodalc-personal-key"
                      keyAlias "bloodalc"
                      keyPassword "bloodalc-personal-key"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.personal
                  }
              }
          }
          GRADLE

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify the APK is signed with the expected key
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::No signed APK was produced."; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee certs.txt
          ACTUAL=$(grep -m1 "certificate SHA-256 digest" certs.txt | awk '{print $NF}')
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK signed with $ACTUAL, expected $EXPECTED_CERT_SHA256"
            exit 1
          fi
          mkdir -p out
          cp "$APK" "out/BloodAlc-1.0.${{ github.run_number }}.apk"

      - name: Keep a copy as a build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: BloodAlc-1.0.${{ github.run_number }}
          path: out/*.apk
          retention-days: 30

      - name: Publish as a Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" out/*.apk \
            --title "Blood-alc 1.0.${{ github.run_number }}" \
            --notes "Tap the .apk file below on your Android phone to install or update." \
            --latest
